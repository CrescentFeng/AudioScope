project:
  seed: 2027
source_data:
  root: data/raw/ESC-50-master
  manifest: data/manifests/esc50.jsonl
soundscapes:
  root: data/sed-esc10-polyphonic
  sample_rate: 16000
  duration_s: 10.0
  scenes:
    train: 300
    validation: 100
    test: 100
  split_folds:
    train: [1, 2, 3]
    validation: [4]
    test: [5]
  classes:
    - chainsaw
    - clock_tick
    - crackling_fire
    - crying_baby
    - dog
    - helicopter
    - rain
    - rooster
    - sea_waves
    - sneezing
  events_per_scene: [2, 4]
  event_duration_s: [1.0, 3.0]
  overlap_probability: 0.65
features:
  n_mels: 64
  n_fft: 512
  frame_ms: 25
  hop_ms: 20
  target_frames: 500
model:
  device: auto
  torch_threads: 8
  channels: [16, 32, 64]
  gru_hidden_size: 64
  dropout: 0.25
  batch_size: 8
  epochs: 30
  early_stopping_patience: 7
  learning_rate: 0.001
  weight_decay: 0.0001
  max_pos_weight: 10.0
  augmentation:
    frequency_mask: 6
    time_mask: 20
postprocess:
  threshold_grid: [0.7, 0.8, 0.85, 0.9, 0.925, 0.95, 0.975]
  smooth_frames: 5
  merge_gap_s: 0.6
  minimum_duration_s: 0.4
metrics:
  event:
    onset_collar_s: 0.2
    offset_collar_s: 0.2
    offset_ratio: 0.2
  segment_resolution_s: 1.0
outputs:
  feature_cache: data/processed/esc10-polyphonic-sed
  artifact_dir: artifacts/esc10-polyphonic-crnn
  report_dir: reports/generated/esc10-polyphonic-crnn
